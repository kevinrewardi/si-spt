version: '3' 
services: 
  mysql: 
    image: 'mysql:8.0' 
    ports: 
      - '3306:3306' 
    environment: 
      MYSQL_ROOT_PASSWORD: 'password' 
      MYSQL_DATABASE: 'si_spt' 
      MYSQL_USER: 'sail' 
      MYSQL_PASSWORD: 'password' 
      ALLOW_EMPTY_PASSWORD: 'yes' 
    volumes: 
      - 'sail-mysql:/var/lib/mysql' 
    networks: 
      - sail 
networks: 
  sail: 
    driver: bridge 
volumes: 
  sail-mysql: 
    driver: local
